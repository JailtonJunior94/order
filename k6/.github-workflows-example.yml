# Example GitHub Actions Workflow for K6 Load Testing
# Copy this file to .github/workflows/k6-load-test.yml in your repository root

name: K6 Load Tests

on:
  # Run on pull requests
  pull_request:
    branches: [ main, develop ]

  # Run on push to main
  push:
    branches: [ main ]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - complete
          - spike

jobs:
  load-test:
    name: Run K6 Load Tests
    runs-on: ubuntu-latest

    services:
      # Add your service dependencies here
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build application
        run: |
          go mod download
          go build -o app ./cmd

      - name: Start application
        run: |
          ./app &
          echo "APP_PID=$!" >> $GITHUB_ENV
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orders_test
          PORT: 8080

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/health 2>/dev/null; do sleep 2; done'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run K6 Load Tests
        run: |
          cd k6
          chmod +x run-ci.sh
          ./run-ci.sh
        env:
          BASE_URL: http://localhost:8080
          TEST_TYPE: ${{ github.event.inputs.test_type || 'quick' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: k6-results
          path: k6/results/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'k6/results/ci-*/summary.json';
            // Add logic to parse summary and comment on PR
            console.log('Test results uploaded as artifact');

      - name: Stop application
        if: always()
        run: |
          if [ ! -z "$APP_PID" ]; then
            kill $APP_PID || true
          fi

  performance-check:
    name: Performance Threshold Check
    runs-on: ubuntu-latest
    needs: load-test
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v3
        with:
          name: k6-results
          path: results/

      - name: Check performance thresholds
        run: |
          # Add custom logic to validate performance metrics
          # Exit with non-zero if thresholds are exceeded
          echo "Checking performance thresholds..."
          # Example: parse summary.json and validate metrics
