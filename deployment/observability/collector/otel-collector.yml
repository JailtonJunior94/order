receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
          - "*"
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  resource:
    attributes:
    - key: cx.application.name
      value: "orders"
      action: upsert
    - key: cx.subsystem.name
      value: "backend"
      action: upsert

exporters:
  debug:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlphttp:
    endpoint: http://loki:3100/otlp

  otlp/coralogix-traces:
    endpoint: ingress.eu2.coralogix.com:443
    headers:
      authorization: Bearer ${CORALOGIX_PRIVATE_KEY}
    compression: gzip
    tls:
      insecure: false

  otlp/coralogix-metrics:
    endpoint: ingress.eu2.coralogix.com:443
    headers:
      authorization: Bearer ${CORALOGIX_PRIVATE_KEY}
    compression: gzip
    tls:
      insecure: false

  otlp/coralogix-logs:
    endpoint: ingress.eu2.coralogix.com:443
    headers:
      authorization: Bearer ${CORALOGIX_PRIVATE_KEY}
    compression: gzip
    tls:
      insecure: false

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch, resource ]
      exporters: [ otlp/jaeger, debug, otlp/coralogix-traces ]
    metrics:
      receivers: [ otlp ]
      processors: [ batch, resource ]
      exporters: [ prometheus, debug, otlp/coralogix-metrics ]
    logs:
      receivers: [ otlp ]
      processors: [ batch, resource ]
      exporters: [ otlphttp, debug, otlp/coralogix-logs ]
