receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
          - "*"
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Processor para adicionar atributos do Coralogix
  resource:
    attributes:
    - key: cx.application.name
      value: ${env:CORALOGIX_APP_NAME}
      action: upsert
    - key: cx.subsystem.name
      from_attribute: service.name
      action: upsert
    - key: deployment.environment
      value: ${env:ENVIRONMENT}
      action: upsert

  # Processor para transformar atributos e enriquecer dados
  attributes:
    actions:
    - key: service.namespace
      value: "orders"
      action: upsert

exporters:
  debug:
    verbosity: detailed

  prometheus:
    endpoint: 0.0.0.0:8889

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlphttp:
    endpoint: http://loki:3100/otlp

  # Exportador para traces do Coralogix
  otlp/coralogix-traces:
    endpoint: ${env:CORALOGIX_DOMAIN}:443
    headers:
      authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY}
    compression: gzip
    tls:
      insecure: false
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Exportador para métricas do Coralogix
  otlp/coralogix-metrics:
    endpoint: ${env:CORALOGIX_DOMAIN}:443
    headers:
      authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY}
    compression: gzip
    tls:
      insecure: false
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Exportador para logs do Coralogix
  otlp/coralogix-logs:
    endpoint: ${env:CORALOGIX_DOMAIN}:443
    headers:
      authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY}
    compression: gzip
    tls:
      insecure: false
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch, resource, attributes ]
      exporters: [ otlp/jaeger, otlp/coralogix-traces ]
    metrics:
      receivers: [ otlp ]
      processors: [ batch, resource, attributes ]
      exporters: [ prometheus, otlp/coralogix-metrics ]
    logs:
      receivers: [ otlp ]
      processors: [ batch, resource, attributes ]
      exporters: [ otlphttp, otlp/coralogix-logs ]
